<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="wallet-logo">
                <svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
            </div>
            <h2>Smart Wallet Tracker</h2>
            <p class="subtitle">Income & Expense Tracker</p>
        </div>

        <div class="balance-section">
            <h3>YOUR BALANCE</h3>
            <h1 id="total-balance">$0.00</h1>
        </div>

        <!-- ইনকাম এবং এক্সপেন্স আলাদা বক্স -->
        <div class="summary-section">
            <div class="summary-box income-box">
                <h4>INCOME</h4>
                <p id="total-income">+$0.00</p>
            </div>
            <div class="summary-box expense-box">
                <h4>EXPENSE</h4>
                <p id="total-expense">-$0.00</p>
            </div>
        </div>

        <div class="history-section">
            <h3>History</h3>
            <div class="lists-container">
                <div class="list-column">
                    <h4 class="income-title">Income</h4>
                    <ul id="income-list" class="transaction-list"></ul>
                    <!-- প্রিন্টের জন্য ইনকাম টোটাল -->
                    <div class="print-total print-income-total" id="print-income-total">Total Income: +$0.00</div>
                </div>
                <div class="separator"></div>
                <div class="list-column">
                    <h4 class="expense-title">Expense</h4>
                    <ul id="expense-list" class="transaction-list"></ul>
                    <!-- প্রিন্টের জন্য এক্সপেন্স টোটাল -->
                    <div class="print-total print-expense-total" id="print-expense-total">Total Expense: -$0.00</div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="text">Text</label>
                    <input type="text" id="text" placeholder="Enter text..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount <span class="sub-label">(negative = expense, positive = income)</span></label>
                    <input type="number" id="amount" placeholder="Enter amount..." step="any" required>
                </div>
                <div class="form-group">
                    <label for="date">Date (Type or Pick)</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" class="btn add-btn">Add Transaction</button>
            </form>
        </div>

        <div class="footer-actions">
            <button onclick="window.print()" class="action-btn print-btn">Print / Save PDF</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Registered successfully!'))
            .catch(err => console.error('Service Worker Registration Failed:', err));
        });
      }
    </script>
</body>
</html>
